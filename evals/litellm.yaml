# LiteLLM proxy ("AI gateway") for the optional eval module.
#
# eval-model points at a DATED model ID. Re-running last month's eval against the
# same alias then means the same model, so a change in the score is a change in
# the skill, not in the model. Moving eval-model to a new model is a deliberate
# event: add a new alias, re-run both, compare, then repoint and re-baseline.
#
# dev-model is an undated alias for day-to-day use; it is allowed to move.

model_list:
  - model_name: eval-model
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: dev-model
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  # Drop request params the upstream model rejects (e.g. a default temperature)
  # instead of failing the call: the gateway absorbs the change, not every client.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
