model_type: credit_default
model_version: v1
experiment_id: lgbm_missing_tags
description: "Identical to lgbm_monotonic (same data, params and seed), but the run 'forgets' part of the tag contract."
baseline_experiment_id: baseline

data:
  table: features
  features:
    - age
    - employment_years
    - income_log
    - loan_amount_scu
    - loan_to_income
    - loan_term_months
    - credit_history_years
    - num_open_accounts
    - num_delinquencies_2y
    - debt_to_income
    - credit_utilization
    - home_ownership
    - loan_purpose
    - region

model:
  lib: lightgbm
  estimator: lgbm_classifier
  params:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 50
    random_state: 7
    monotone_constraints:
      debt_to_income: 1
      credit_utilization: 1
      num_delinquencies_2y: 1
      loan_to_income: 1
      employment_years: -1

# DEMO ONLY: simulates a training script that does not follow the standard, so that
# `make seed` leaves one broken run for the review-experiment skill to catch.
# The training entrypoint checks the run against the contract and marks it FAILED.
demo_fault:
  drop_tags: [demo.data_snapshot]
  override_tags:
    demo.standard_version: "0.9.0"
