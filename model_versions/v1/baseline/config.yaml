model_type: credit_default
model_version: v1
experiment_id: baseline
description: "Baseline: regularised logistic regression on all features."

data:
  table: features
  features:
    - age
    - employment_years
    - income_log
    - loan_amount_scu
    - loan_to_income
    - loan_term_months
    - credit_history_years
    - num_open_accounts
    - num_delinquencies_2y
    - debt_to_income
    - credit_utilization
    - home_ownership
    - loan_purpose
    - region

model:
  lib: sklearn
  estimator: logistic_regression
  params:
    C: 1.0
    max_iter: 1000
