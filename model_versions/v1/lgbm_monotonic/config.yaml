model_type: credit_default
model_version: v1
experiment_id: lgbm_monotonic
description: "LightGBM with monotone constraints: more debt, utilisation or delinquencies never lowers predicted risk."
baseline_experiment_id: baseline

data:
  table: features
  features:
    - age
    - employment_years
    - income_log
    - loan_amount_scu
    - loan_to_income
    - loan_term_months
    - credit_history_years
    - num_open_accounts
    - num_delinquencies_2y
    - debt_to_income
    - credit_utilization
    - home_ownership
    - loan_purpose
    - region

model:
  lib: lightgbm
  estimator: lgbm_classifier
  params:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 50
    random_state: 7
    # +1 = predicted risk may only go up as the feature goes up; -1 = only down.
    monotone_constraints:
      debt_to_income: 1
      credit_utilization: 1
      num_delinquencies_2y: 1
      loan_to_income: 1
      employment_years: -1
